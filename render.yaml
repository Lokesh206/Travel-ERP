services:
  - type: web
    name: wanderwise-travel-erp
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python -c "from app import initialize_db; initialize_db()"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRAVEL_ERP_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production
